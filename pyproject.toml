[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-product-search-reranking"
version = "0.1.0"
description = "Reliability-first GPU semantic product search reranking on ESCI."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<25",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
train = [
    "accelerate==1.14.0",
    "protobuf>=5,<8",
    "safetensors==0.8.0",
    "sentencepiece==0.2.1",
    "transformers==5.13.0",
]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"